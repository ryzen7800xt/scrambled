spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:scrambled;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.web.resources.static-locations=file:./src/,classpath:/static/
server.port=${PORT:8080}
recipeapp.auth.cookie-secure=${SCRAMBLED_COOKIE_SECURE:false}
